name: Sync Printful products

# Pulls products from Printful into data/products.json and commits the change.
# Setup: repo Settings → Secrets and variables → Actions → New repository secret
#   PRINTFUL_TOKEN     (required) your Printful private token
#   PRINTFUL_STORE_ID  (optional) only for an account-level token
on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  schedule:
    - cron: '17 4 * * *'      # every day at 04:17 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check token
        id: check
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
        run: |
          if [ -z "$PRINTFUL_TOKEN" ]; then echo "PRINTFUL_TOKEN secret not set, skipping (demo products stay)."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Sync
        if: steps.check.outputs.skip != 'true'
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
        run: node scripts/sync-printful.mjs
      - name: Commit changes
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "beldi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet && echo "No product changes" || (git commit -m "Sync products from Printful" && git push)
